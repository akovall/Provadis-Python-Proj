<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery · Image to SVG</title>
<style>
  :root {
    --bg: #f5f5f4; --panel: #ffffff; --text: #1c1917; --muted: #78716c;
    --border: #e7e5e4; --accent: #2563eb; --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1917; --panel: #292524; --text: #f5f5f4; --muted: #a8a29e;
      --border: #44403c; --accent: #3b82f6;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, sans-serif; color: var(--text); background: var(--bg); }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 16px 24px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 18px; margin: 0; }
  header a { color: var(--accent); text-decoration: none; }
  .busy {
    margin-left: auto; display: none; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px;
    background: var(--panel); color: var(--muted); border: 1px solid var(--border);
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .busy.on { display: flex; }
  .spinner {
    width: 16px; height: 16px; border-radius: 50%; flex: none;
    border: 2px solid var(--border); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; padding: 24px; }
  .empty { color: var(--muted); padding: 24px; display: none; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); }
  figure { position: relative; margin: 0; height: 170px; background: var(--panel); }
  /* Checkerboard shows transparent areas of the SVG */
  figure.transparent { background: repeating-conic-gradient(#d6d3d1 0 25%, #ffffff 0 50%) 0 0 / 16px 16px; }
  figure img { width: 100%; height: 100%; object-fit: contain; display: block; }
  figure img:not([src]) { visibility: hidden; }
  figure .spinner { position: absolute; top: 50%; left: 50%; margin: -8px 0 0 -8px; display: none; }
  figure.loading .spinner { display: block; }
  figcaption {
    position: absolute; top: 6px; left: 6px; padding: 1px 6px; border-radius: 4px; font-size: 11px;
    background: rgba(0,0,0,.6); color: #fff;
  }
  .info { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .title { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .title b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .badge.preset { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 8px; margin: 0; }
  .metrics dt { color: var(--muted); font-size: 11px; }
  .metrics dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .metrics .good { color: #16a34a; }
  .metrics .okay { color: #d97706; }
  .metrics .poor { color: #dc2626; }
  .status { color: var(--muted); font-size: 12px; }
  .status.failed { color: #dc2626; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .actions[hidden] { display: none; }
  .download, .png {
    background: var(--accent); color: var(--accent-text); border: 0; border-radius: 6px; cursor: pointer;
    padding: 6px 12px; text-decoration: none; font: inherit; font-weight: 600; font-size: 13px;
  }
  .scale {
    min-width: 0; padding: 5px 6px; font: inherit; font-size: 13px; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px;
  }
  @media (max-width: 700px) {
    header { padding: 12px 16px; }
    .grid { padding: 16px; grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <h1>Gallery</h1>
  <a href="/">← Converter</a>
  <div class="busy on" id="busy"><div class="spinner"></div><span id="busyText">Loading gallery…</span></div>
</header>
<main class="grid" id="grid"></main>
<p class="empty" id="empty">No images yet. Add some to the img/ folder or convert one on the main page.</p>

<template id="cardTemplate">
  <article class="card">
    <div class="pair">
      <figure><img class="original" alt="Original"><figcaption>Original</figcaption></figure>
      <figure class="vector"><img class="svg" alt="SVG"><div class="spinner"></div><figcaption>SVG</figcaption></figure>
    </div>
    <div class="info">
      <div class="title"><b class="name"></b><span class="badge preset"></span><span class="badge source"></span></div>
      <dl class="metrics">
        <div><dt title="Average color difference to the original, 0–255, lower is better. With a removed background only the object counts. Good below 5, okay below 12.">Error</dt><dd class="error"></dd></div>
        <div><dt>Colors</dt><dd class="colors"></dd></div>
        <div><dt>Paths</dt><dd class="paths"></dd></div>
        <div><dt>Curves</dt><dd class="curves"></dd></div>
        <div><dt>Size</dt><dd class="size"></dd></div>
        <div><dt>Time</dt><dd class="seconds"></dd></div>
      </dl>
      <div class="status"></div>
      <div class="actions" hidden>
        <a class="download" title="Download SVG">↓ SVG</a>
        <select class="scale" aria-label="PNG size"></select>
        <button class="png" type="button" title="Download PNG of the chosen size">↓ PNG</button>
      </div>
    </div>
  </article>
</template>

<script src="/static/export.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const cards = new Map();
const STATUS = { queued: "Waiting…", working: "Vectorizing…", measuring: "Measuring error…", done: "", failed: "" };
let order = "";

function createCard(tile) {
  const card = $("cardTemplate").content.firstElementChild.cloneNode(true);
  card.dataset.version = "0";
  card.querySelector(".png").addEventListener("click", async () => {
    const scale = Number(card.querySelector(".scale").value);
    const status = card.querySelector(".status");
    try {
      const response = await fetch(card.querySelector(".svg").src);
      if (!response.ok) throw new Error("the SVG is no longer in the gallery");
      await downloadPng(await response.text(), scale, `${card.dataset.stem}@${scale}x.png`);
    } catch (error) {
      status.textContent = "PNG failed: " + error.message;
    }
  });
  cards.set(tile.id, card);
  return card;
}

function fill(card, tile) {
  const field = (name) => card.querySelector("." + name);
  const show = (name, value) => field(name).textContent = value ?? "–";
  show("name", tile.name);
  field("name").title = tile.name;
  show("preset", tile.preset ? tile.preset + (tile.auto ? " · auto" : "") : "…");
  show("source", tile.source === "history" ? "History" : "img/");
  show("error", tile.error == null ? null : `${tile.error.toFixed(2)} (${tile.rating})`);
  field("error").className = "error " + (tile.rating || "");
  show("colors", tile.colors);
  show("paths", tile.paths?.toLocaleString());
  show("curves", tile.curves?.toLocaleString());
  show("size", tile.bytes == null ? null : (tile.bytes / 1024).toFixed(0) + " KB");
  show("seconds", tile.seconds == null ? null : tile.seconds + " s");
  field("status").textContent = tile.status === "failed" ? "Failed: " + tile.message : STATUS[tile.status];
  field("status").classList.toggle("failed", tile.status === "failed");
  field("svg").parentElement.classList.toggle("loading", tile.status === "queued" || tile.status === "working");
  field("svg").parentElement.classList.toggle("transparent", Boolean(tile.settings?.remove_background));
  if (tile.version > 0 && card.dataset.version !== String(tile.version)) {
    const base = `/api/gallery/${tile.id}/`;
    if (!field("original").getAttribute("src")) field("original").src = base + "original.png";
    field("svg").src = `${base}image.svg?v=${tile.version}`;
    card.dataset.stem = tile.name.replace(/\.[^.]+$/, "");
    field("download").href = field("svg").src;
    field("download").download = card.dataset.stem + ".svg";
    fillScaleSelect(field("scale"), tile.width, tile.height);
    field("actions").hidden = false;
    card.dataset.version = String(tile.version);
  }
}

function render(data) {
  const ids = data.tiles.map((tile) => tile.id);
  for (const tile of data.tiles) fill(cards.get(tile.id) || createCard(tile), tile);
  for (const [id, card] of cards) {
    if (!ids.includes(id)) { card.remove(); cards.delete(id); }
  }
  // Only re-append when the order changed, so the images are not touched on every poll
  if (ids.join() !== order) {
    for (const id of ids) $("grid").appendChild(cards.get(id));
    order = ids.join();
  }
  $("empty").style.display = ids.length ? "none" : "block";
  $("busy").classList.toggle("on", data.pending > 0);
  $("busyText").textContent = `Vectorizing… ${data.pending} left`;
}

async function refresh() {
  try {
    const response = await fetch("/api/gallery");
    if (response.ok) render(await response.json());
  } catch (error) {
    // The server is restarting; try again on the next tick
  }
  setTimeout(refresh, 2000);
}

refresh();
</script>
</body>
</html>
